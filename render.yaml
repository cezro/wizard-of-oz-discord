# Render Blueprint — Daily Standup Summarizer
#
# After deploy:
# 1. Run supabase/migrations in Supabase SQL editor.
# 2. Set secret env vars in the Render dashboard for the web service.
# 3. Discord Developer Portal → Interactions Endpoint URL:
#    https://<your-service>.onrender.com/discord/interactions
# 4. In Discord: /standup-config set channel:#your-standup-channel
#
# Scheduled reminders/nudges/summaries run in-process (STANDUP_INTERNAL_SCHEDULER,
# default on) while the process is running.
#
# Free tier (plan: free): the service spins down after ~15 min without inbound HTTP.
# After deploy, configure external keep-alive — see docs/env-setup.md
# "Render free tier: keep scheduler alive":
#   - GET /health every 10 minutes (UptimeRobot, cron-job.org, etc.)
#   - Optional backup: POST /cron/standup at 03:00 and 09:00 UTC Mon–Fri
#     (11:00 and 17:00 Asia/Manila defaults), GET /health at 08:55 UTC Mon–Fri

services:
  - type: web
    name: standup-summarizer
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STANDUP_INTERNAL_SCHEDULER
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
